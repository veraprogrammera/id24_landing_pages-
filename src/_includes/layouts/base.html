<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<script>
  // En funktion för att slippa skriva samma inställningar två gånger
  function loadParticles(id) {
    if(document.getElementById(id)) {
      particlesJS(id, {
        "particles": {
          "number": { "value": 50 },
          "color": { "value": "#e3aebc" },
          "shape": { "type": "circle" },
          "opacity": { "value": 0.5 },
          "size": { "value": 3 },
          "line_linked": {
            "enable": true,
            "distance": 150,
            "color": "#e3aebc",
            "opacity": 0.4,
            "width": 1
          },
          "move": { "enable": true, "speed": 2 }
        },
        "interactivity": {
          "events": {
            "onhover": { "enable": true, "mode": "grab" }
          }
        }
      });
    }
  }

  // Starta partiklarna för båda sektionerna
  // Starta partiklarna för sektionerna
  loadParticles("particles-hero"); // <-- Ny rad för din hero!
</script>


</body>
